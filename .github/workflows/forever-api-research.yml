name: Inspect public Forever milestone data
on:
  push:
    branches: [codex/forever-api-research]
    paths: [.github/workflows/forever-api-research.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Summarize public roster endpoints
        env:
          BATTLENET_CLIENT_ID: ${{ secrets.BATTLENET_CLIENT_ID }}
          BATTLENET_CLIENT_SECRET: ${{ secrets.BATTLENET_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const roster = JSON.parse(await readFile('src/roster.json','utf8'));
          const tokenResponse = await fetch('https://oauth.battle.net/token', {
            method:'POST', redirect:'error', signal:AbortSignal.timeout(15000),
            headers:{Authorization:'Basic '+Buffer.from(process.env.BATTLENET_CLIENT_ID+':'+process.env.BATTLENET_CLIENT_SECRET).toString('base64')},
            body:new URLSearchParams({grant_type:'client_credentials'})
          });
          if (!tokenResponse.ok) throw new Error('Battle.net token request returned '+tokenResponse.status);
          const {access_token:token}=await tokenResponse.json();
          async function get(path, scope='profile') {
            const url=new URL(path,'https://eu.api.blizzard.com');
            url.searchParams.set('namespace',scope+'-forever-eu');
            url.searchParams.set('locale','en_GB');
            try {
              const res=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(12000)});
              return {status:res.status,data:res.ok?await res.json():{}};
            } catch {
              return {status:'timeout or transport error',data:{}};
            }
          }
          const name = (value) => typeof value==='string'?value:value?.en_GB??value?.en_US;
          function flatten(node, parent='') {
            const path=[parent,name(node.name)].filter(Boolean).join(' / ');
            return [...(node.statistics??[]).map(row=>({...row,path})),
              ...[...(node.categories??[]),...(node.sub_categories??[])].flatMap(child=>flatten(child,path))];
          }
          const groups=new Map();
          let bossCounters=0, timestampedCounters=0;
          for(let offset=0;offset<roster.length;offset+=3){
            await Promise.all(roster.slice(offset,offset+3).map(async hero=>{
              const slug=encodeURIComponent(hero.name.toLowerCase().replaceAll(' ','-'));
              const stat=await get('/profile/wow/character/'+slug+'/achievements/statistics');
              const rows=flatten(stat.data);
              const boss=rows.filter(row=>/^.+? kills? \(.+\)$/i.test(name(row.name)??'') &&
                typeof row.quantity==='number' && row.quantity>0);
              bossCounters+=boss.length;
              for(const row of boss){
                if(!row.last_updated_timestamp)continue;
                timestampedCounters++;
                const id=row.id+'/'+row.last_updated_timestamp;
                if(!groups.has(id)) groups.set(id,{title:name(row.name),stamp:row.last_updated_timestamp,heroes:[]});
                groups.get(id).heroes.push(hero.name);
              }
              console.log(JSON.stringify({hero:hero.name,status:stat.status,boss:boss.slice(0,10).map(row=>({title:name(row.name),quantity:row.quantity,lastUpdated:row.last_updated_timestamp})),
                dungeonCategories:[...new Set(rows.filter(row=>/dungeon|raid|boss/i.test(row.path)).map(row=>row.path))]}));
            }));
          }
          const shared=[...groups.values()].filter(row=>row.heroes.length>=2).sort((a,b)=>b.stamp-a.stamp);
          console.log(JSON.stringify({bossCounters,timestampedCounters,sharedGroups:shared.length,threeOrMore:shared.filter(row=>row.heroes.length>=3),examples:shared.slice(0,5)}));
          JS
