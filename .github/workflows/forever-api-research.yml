name: Inspect public Forever milestone data
on:
  push:
    branches: [codex/forever-api-research]
    paths: [.github/workflows/forever-api-research.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Summarize public roster endpoints
        env:
          BATTLENET_CLIENT_ID: ${{ secrets.BATTLENET_CLIENT_ID }}
          BATTLENET_CLIENT_SECRET: ${{ secrets.BATTLENET_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const roster = JSON.parse(await readFile('src/roster.json','utf8'));
          const tokenResponse = await fetch('https://oauth.battle.net/token', {
            method:'POST', redirect:'error', signal:AbortSignal.timeout(15000),
            headers:{Authorization:'Basic '+Buffer.from(process.env.BATTLENET_CLIENT_ID+':'+process.env.BATTLENET_CLIENT_SECRET).toString('base64')},
            body:new URLSearchParams({grant_type:'client_credentials'})
          });
          if (!tokenResponse.ok) throw new Error('Battle.net token request returned '+tokenResponse.status);
          const {access_token:token}=await tokenResponse.json();
          async function get(path, scope='profile') {
            const url=new URL(path,'https://eu.api.blizzard.com');
            url.searchParams.set('namespace',scope+'-forever-eu');
            url.searchParams.set('locale','en_GB');
            try {
              const res=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(12000)});
              return {status:res.status,data:res.ok?await res.json():{}};
            } catch {
              return {status:'timeout or transport error',data:{}};
            }
          }
          const name = (value) => typeof value==='string'?value:value?.en_GB??value?.en_US;
          const dated = (timestamp) => Number.isFinite(timestamp)&&timestamp>0 ? new Date(timestamp<1e12?timestamp*1000:timestamp).toISOString():null;
          const fields = (data) => Object.keys(data).filter(key=>!/links|character$/.test(key));
          function achievements(response) {
            const a=response.data;
            const rows=a.achievements??[];
            return {status:response.status, points:a.total_points, listed:rows.length,
              dated:rows.filter(row=>dated(row.completed_timestamp)).map(row=>({id:row.id,title:name(row.achievement?.name),at:dated(row.completed_timestamp)})),
              undated:rows.filter(row=>!dated(row.completed_timestamp)).slice(0,5).map(row=>({id:row.id,title:name(row.achievement?.name),completed:row.criteria?.is_completed})),
              recent:(a.recent_events??[]).length};
          }
          function statistics(response) {
            const rows=(response.data.categories??[]).flatMap(category=>[...(category.statistics??[]),...(category.sub_categories??[]).flatMap(sub=>sub.statistics??[])]);
            return {status:response.status,count:rows.length, matches:rows.map(row=>name(row.name)).filter(title=>title&&/pvp|honorable|highest level|dungeon|creation|time played/i.test(title)).slice(0,15)};
          }
          function criteriaSummary(value) {
            if (Array.isArray(value)) return value.map(criteriaSummary);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.entries(value)
              .filter(([key])=>!['key','_links','media','parent'].includes(key))
              .map(([key,entry])=>[key,criteriaSummary(entry)]));
          }
          for(const id of [61997,62003,62021,62031]){
            const response=await get('/data/wow/achievement/'+id,'static');
            const data=response.data;
            console.log(JSON.stringify({detail:{id,status:response.status,title:name(data.name),description:name(data.description),accountWide:data.is_account_wide,criteria:criteriaSummary(data.criteria)}}));
          }
          const profile=await get('/profile/wow/character/chipson-bomfrey/achievements');
          const record=profile.data.achievements?.find(row=>row.id===62031);
          console.log(JSON.stringify({spelunker:{id:record?.id,date:dated(record?.completed_timestamp),criteria:criteriaSummary(record?.criteria)},keys:Object.keys(record?.criteria??{})}));
          JS
