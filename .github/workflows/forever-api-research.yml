name: Inspect public Forever milestone data
on:
  push:
    branches: [codex/forever-api-research]
    paths: [.github/workflows/forever-api-research.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Summarize public roster endpoints
        env:
          BATTLENET_CLIENT_ID: ${{ secrets.BATTLENET_CLIENT_ID }}
          BATTLENET_CLIENT_SECRET: ${{ secrets.BATTLENET_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const roster = JSON.parse(await readFile('src/roster.json','utf8'));
          const tokenResponse = await fetch('https://oauth.battle.net/token', {
            method:'POST', redirect:'error', signal:AbortSignal.timeout(15000),
            headers:{Authorization:'Basic '+Buffer.from(process.env.BATTLENET_CLIENT_ID+':'+process.env.BATTLENET_CLIENT_SECRET).toString('base64')},
            body:new URLSearchParams({grant_type:'client_credentials'})
          });
          if (!tokenResponse.ok) throw new Error('Battle.net token request returned '+tokenResponse.status);
          const {access_token:token}=await tokenResponse.json();
          async function get(path, scope='profile') {
            const url=new URL(path,'https://eu.api.blizzard.com');
            url.searchParams.set('namespace',scope+'-forever-eu');
            url.searchParams.set('locale','en_GB');
            try {
              const res=await fetch(url,{headers:{Authorization:'Bearer '+token},redirect:'error',signal:AbortSignal.timeout(12000)});
              return {status:res.status,data:res.ok?await res.json():{}};
            } catch {
              return {status:'timeout or transport error',data:{}};
            }
          }
          const name=v=>typeof v==='string'?v:v?.en_GB??v?.en_US;
          const stats=node=>[...(node.statistics??[]),...[...(node.categories??[]),...(node.sub_categories??[])].flatMap(stats)];
          const groups=new Map();
          for(let i=0;i<roster.length;i+=3) await Promise.all(roster.slice(i,i+3).map(async hero=>{
            const slug=encodeURIComponent(hero.name.toLowerCase().replaceAll(' ','-'));
            const result=await get('/profile/wow/character/'+slug+'/achievements/statistics');
            const data=stats(result.data).filter(x=>x.quantity>0&&x.last_updated_timestamp&&/ kills? \(.+\)$/i.test(name(x.name)??''));
            for(const s of data){
              const key=s.id+'/'+s.last_updated_timestamp;
              if(!groups.has(key))groups.set(key,{id:s.id,title:name(s.name),at:new Date(s.last_updated_timestamp).toISOString(),members:[]});
              groups.get(key).members.push(hero.name);
            }
            console.log(JSON.stringify({hero:hero.name,status:result.status,counters:data.map(s=>[s.id,name(s.name),new Date(s.last_updated_timestamp).toISOString(),s.quantity])}));
          }));
          console.log(JSON.stringify({shared:[...groups.values()].filter(g=>g.members.length>=2)}));
          for(const id of [61997,62021,62031,728]){
            const d=await get('/data/wow/achievement/'+id,'static');
            console.log(JSON.stringify({definition:{id,category:d.data.category,accountWide:d.data.is_account_wide,description:d.data.description,keys:Object.keys(d.data)}}));
          }
          JS
