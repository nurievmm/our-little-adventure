name: Publish the adventure

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Refresh Battle.net snapshot
        run: npm run sync
        env:
          BATTLENET_CLIENT_ID: ${{ secrets.BATTLENET_CLIENT_ID }}
          BATTLENET_CLIENT_SECRET: ${{ secrets.BATTLENET_CLIENT_SECRET }}
          PREVIOUS_SNAPSHOT_URL: ${{ steps.pages.outputs.base_url }}/characters.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        id: artifact
        with:
          path: dist
      - name: Deploy the uploaded Pages artifact
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          import { setTimeout } from 'node:timers/promises';

          const env = process.env;
          const endpoint = env.GITHUB_API_URL + '/repos/' + env.GITHUB_REPOSITORY + '/pages/deployments';
          const artifactId = Number(env.PAGES_ARTIFACT_ID);
          if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Pages upload returned no artifact ID.');

          // Confirm the uploaded archive is readable before Pages tries to pull it.
          const archive = env.GITHUB_API_URL + '/repos/' + env.GITHUB_REPOSITORY + '/actions/artifacts/' + artifactId + '/zip';
          async function archiveReady() {
            const response = await fetch(archive, {
              headers: { Authorization: 'Bearer ' + env.GH_TOKEN },
              redirect: 'manual',
              signal: AbortSignal.timeout(10_000),
            });
            const location = response.headers.get('location');
            if (response.status !== 302 || !location) return false;
            const stored = await fetch(location, {
              headers: { Range: 'bytes=0-3' },
              signal: AbortSignal.timeout(10_000),
            });
            if (!stored.ok) return false;
            const bytes = new Uint8Array(await stored.arrayBuffer());
            return bytes[0] === 0x50 && bytes[1] === 0x4b;
          }
          for (let attempt = 0; !(await archiveReady()); attempt++) {
            if (attempt === 8) throw new Error('The uploaded Pages archive never became readable.');
            await setTimeout(5_000);
          }

          async function request(url, token, body) {
            const response = await fetch(url, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json', 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
              redirect: 'error',
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) throw new Error('GitHub returned HTTP ' + response.status + ' for ' + new URL(url).pathname);
            return response.json();
          }

          const identity = await request(env.ACTIONS_ID_TOKEN_REQUEST_URL, env.ACTIONS_ID_TOKEN_REQUEST_TOKEN);
          const release = await request(endpoint, env.GH_TOKEN, {
            artifact_id: artifactId,
            pages_build_version: env.GITHUB_SHA,
            oidc_token: identity.value,
          });
          if (!release.id) throw new Error('GitHub Pages did not return a deployment ID.');
          console.log('Pages deployment ID: ' + release.id);
          for (let attempt = 0; attempt < 45; attempt++) {
            const { status } = await request(endpoint + '/' + encodeURIComponent(release.id), env.GH_TOKEN);
            if (status === 'succeed') {
              await appendFile(env.GITHUB_OUTPUT, 'page_url=' + env.PAGES_URL + '\n');
              process.exit(0);
            }
            if (/fail|cancel|error|lost|not_found|invalid/.test(status)) throw new Error('Pages deployment ended with status ' + status);
            await setTimeout(5_000);
          }
          throw new Error('Timed out waiting for Pages deployment.');
          JS
